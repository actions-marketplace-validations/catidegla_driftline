name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step, because there is nothing to install. That is the
      # point of the dependency count in the README, and a lockfile that
      # never appears is the proof.
      - name: No dependencies were added
        shell: bash
        run: |
          test ! -f package-lock.json || (echo "a lockfile appeared, so something was added" && exit 1)
          node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) { console.error('dependencies appeared in package.json'); process.exit(1); }"

      - name: Test
        run: npm test

  statistics:
    name: The numbers the tool prints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Given its own job rather than blending into the matrix. If the
      # chi-square implementation drifts, every p-value driftline reports is
      # wrong and the tool is confidently misleading rather than broken.
      - name: Critical values still match the published tables
        run: node --test test/statistics.test.mjs

  action:
    name: The action runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # A provider that answers, so the action has something real to read.
      - name: Stand up a local OpenAI shaped server
        run: |
          cat > server.mjs <<'JS'
          import { createServer } from 'node:http';
          createServer((req, res) => {
            let body = '';
            req.on('data', (c) => { body += c; });
            req.on('end', () => {
              res.writeHead(200, { 'content-type': 'application/json', 'x-request-id': 'ci' });
              res.end(JSON.stringify({
                system_fingerprint: 'fp_ci_0001',
                model: 'ci-model',
                choices: [{ message: { role: 'assistant', content: '{"ok": true}' } }],
              }));
            });
          }).listen(11434, () => console.log('listening'));
          JS
          node server.mjs &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://localhost:11434 && break
            sleep 0.25
          done

          cat > probes.jsonl <<'JSON'
          {"id":"json-contract","provider":"compatible","model":"ci-model","prompt":"Return only JSON: {\"ok\": true}","strategy":"shape","samples":4}
          JSON

      - id: first
        uses: ./
        env:
          OPENAI_COMPATIBLE_BASE_URL: http://localhost:11434
          OPENAI_COMPATIBLE_API_KEY: not-a-real-key
        with:
          probes: probes.jsonl
          db: .ci/history.db

      - name: A first run has no baseline and must not report drift
        run: |
          [ "${{ steps.first.outputs.drifted }}" = "0" ] || { echo "reported drift with nothing to compare against"; exit 1; }
          test -f "${{ steps.first.outputs.report }}" || { echo "no report was written"; exit 1; }

      # The behaviour that decides whether anybody keeps a canary on: a run it
      # could not read is not drift, and must not fail the job or somebody gets
      # paged for an expired key.
      - name: A provider it cannot reach warns instead of failing
        id: unreachable
        uses: ./
        env:
          OPENAI_COMPATIBLE_BASE_URL: http://localhost:1
          OPENAI_COMPATIBLE_API_KEY: not-a-real-key
        with:
          probes: probes.jsonl
          db: .ci/history.db
          comment: 'false'

      - name: It passed, because unreadable is not drift
        run: |
          [ "${{ steps.unreachable.outcome }}" = "success" ] || { echo "an unreachable provider failed the job"; exit 1; }
          echo "unreadable and drifted stay apart"
