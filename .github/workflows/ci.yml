name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step, because there is nothing to install. That is the
      # point of the dependency count in the README, and a lockfile that
      # never appears is the proof.
      - name: No dependencies were added
        shell: bash
        run: |
          test ! -f package-lock.json || (echo "a lockfile appeared, so something was added" && exit 1)
          node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) { console.error('dependencies appeared in package.json'); process.exit(1); }"

      - name: Test
        run: npm test

  statistics:
    name: The numbers the tool prints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Given its own job rather than blending into the matrix. If the
      # chi-square implementation drifts, every p-value driftline reports is
      # wrong and the tool is confidently misleading rather than broken.
      - name: Critical values still match the published tables
        run: node --test test/statistics.test.mjs
