name: driftline
description: Detect when an LLM provider changes the model under a name that did not change.
author: Christ-loisele Atidegla

branding:
  icon: activity
  color: blue

inputs:
  probes:
    description: Probe definitions, JSON lines.
    default: probes.jsonl
  label:
    description: The series to compare within. Keep branches on their own label so they never become the baseline for main.
    default: main
  db:
    description: History database. Cache or commit this, since drift is only visible against history.
    default: .driftline/history.db
  min-effect:
    description: How far a distribution must move to be worth reporting, 0 to 1. Significance without an effect size turns a canary into furniture.
    default: '0.15'
  fdr:
    description: False discovery rate across probes. Thirty probes at five percent produce about one and a half false alarms a day on a provider that never changed.
    default: '0.05'
  comment:
    description: Write the report to the job summary.
    default: 'true'
  fail-on-drift:
    description: Fail the job when a probe drifts. Set false to report without blocking.
    default: 'true'

outputs:
  drifted:
    description: How many probes drifted.
    value: ${{ steps.check.outputs.drifted }}
  proven:
    description: How many of those the provider itself confirmed.
    value: ${{ steps.check.outputs.proven }}
  report:
    description: Path to the JSON report.
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - id: check
      shell: bash
      run: |
        # One sampling pass, two outputs. Running check again for the report
        # would send every request a second time, and every request here is
        # billed by the provider.
        args=(check
          --probes "${{ inputs.probes }}"
          --label "${{ inputs.label }}"
          --db "${{ inputs.db }}"
          --min-effect "${{ inputs.min-effect }}"
          --fdr "${{ inputs.fdr }}"
        )

        if [ "${{ inputs.comment }}" = "true" ]; then
          args+=(--markdown-out driftline.md)
        fi

        set +e
        node "${{ github.action_path }}/bin/driftline.mjs" "${args[@]}" --json > driftline.json
        code=$?
        set -e

        drifted=$(node -p "JSON.parse(require('fs').readFileSync('driftline.json','utf8')).summary.drifted")
        proven=$(node -p "JSON.parse(require('fs').readFileSync('driftline.json','utf8')).summary.proven")
        echo "drifted=$drifted" >> "$GITHUB_OUTPUT"
        echo "proven=$proven" >> "$GITHUB_OUTPUT"
        echo "report=driftline.json" >> "$GITHUB_OUTPUT"

        if [ -f driftline.md ]; then cat driftline.md >> "$GITHUB_STEP_SUMMARY"; fi

        # Exit 3 means the run could not be read, which is not the same as
        # drift and must not be reported as it. A job that conflates the two
        # eventually pages somebody about an expired API key.
        if [ "$code" = "3" ]; then
          echo "::warning::driftline could not read this run: too many requests failed"
          exit 0
        fi

        if [ "${{ inputs.fail-on-drift }}" = "true" ]; then exit $code; fi
